<!--
  Generated template for the MipPage page.

  See http://ionicframework.com/docs/components/#navigation for more info on
  Ionic pages and navigation.
-->
<ion-header class="blue-nav">
  <ion-navbar color="primary">
    <ion-buttons left>
      <button ion-button menuToggle>
        <ion-icon name="menu"></ion-icon>
      </button>
    </ion-buttons>
    <ion-title>{{ "mip" | translate }}</ion-title>
  </ion-navbar>
</ion-header>

<ion-content padding>
  <form #form="ngForm">
    <ion-list no-lines>
      <ion-item-group>
        <ion-item-divider color="primary">
          {{ "mip" | translate }}
        </ion-item-divider>
        <ion-grid padding class="fields-grid">
          <ion-row>
            <ion-col col-6 no-padding>
              <ion-item
                no-padding
                no-lines
                class="no-border"
                (click)="setMipDate('startDate')"
              >
                <ion-label stacked
                  >{{ 'os_mip.start_date' | translate }}</ion-label
                >
                <ion-datetime
                  cancelText="{{ 'cancel' | translate }}"
                  doneText="{{ 'confirm' | translate }}"
                  placeholder="dd/mm/aaaa"
                  required
                  [max]="currentDate"
                  displayFormat="DD/MM/YYYY"
                  [(ngModel)]="startDate"
                  name="startDate"
                ></ion-datetime>
              </ion-item>
            </ion-col>
            <ion-col col-6 no-padding>
              <ion-item
                no-padding
                no-lines
                class="no-border"
                (click)="setMipDate('endDate')"
              >
                <ion-label stacked
                  >{{ 'os_mip.end_date' | translate }}</ion-label
                >
                <ion-datetime
                  cancelText="{{ 'cancel' | translate }}"
                  doneText="{{ 'confirm' | translate }}"
                  placeholder="dd/mm/aaaa"
                  required
                  [min]="startDate"
                  [max]="maxyear"
                  displayFormat="DD/MM/YYYY"
                  [(ngModel)]="endDate"
                  name="endDate"
                ></ion-datetime>
              </ion-item>
            </ion-col>
          </ion-row>
        </ion-grid>
        <ion-item no-padding no-lines class="no-border">
          <ion-label stacked>{{ "os_mip.area_sector" | translate }}</ion-label>
          <ionic-selectable
            placeholder="{{'select' | translate }}"
            item-content
            [isMultiple]="false"
            name="sector"
            [(ngModel)]="sector"
            [items]="sectors"
            itemValueField="id"
            required
            itemTextField="name"
            [canSearch]="true"
            searchPlaceholder="{{'search' | translate }}"
            searchFailText="{{'no_items_found' | translate }}"
          >
          </ionic-selectable>
        </ion-item>
        <ion-item no-padding no-lines class="no-border number-input">
          <ion-label stacked>{{'notes' | translate }}</ion-label>
          <ion-textarea
            placeholder="{{'notes' | translate }}"
            [(ngModel)]="comments"
            name="comments"
          ></ion-textarea>
        </ion-item>

        <ion-item
          *ngIf="!pests?.length"
          no-lines
          no-padding
          no-margin
          class="inner-card-button"
        >
          <button
            item-right
            [disabled]="form.invalid"
            ion-button
            big
            color="primary"
            (click)="openPestSelector(i)"
          >
            {{'os_mip.inform_plagues' | translate}}
          </button>
        </ion-item>

        <ion-list *ngIf="pests.length">
          <ion-item *ngFor="let pest of pests; let a = index">
            <ion-icon name="bug" item-start></ion-icon>
            <h2>{{ pest.name }}</h2>
            <p>
              <strong>{{'os_mip.amount' | translate}}: </strong>{{ pest.count ?
              pest.count : 0 }}
            </p>
            <button ion-button clear item-end (click)="pests.splice(a, 1)">
              {{'remove' | translate}}
            </button>
          </ion-item>
        </ion-list>

        <ion-grid padding>
          <ion-row>
            <ion-col no-padding col-12
              ><button
                ion-button
                full
                [disabled]="form.invalid || !pests?.length"
                color="primary"
                (click)="save(form)"
              >
                {{'save' | translate}}
              </button></ion-col
            >
          </ion-row>
        </ion-grid>
      </ion-item-group>
    </ion-list>
  </form>
</ion-content>
