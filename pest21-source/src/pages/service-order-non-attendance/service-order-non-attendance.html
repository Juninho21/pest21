<!--

  See http://ionicframework.com/docs/components/#navigation for more info on
  Ionic pages and navigation.
-->
<ion-header class="blue-nav">
  <ion-navbar color="primary">
    <ion-buttons left>
      <button ion-button menuToggle>
        <ion-icon name="menu"></ion-icon>
      </button>
    </ion-buttons>
    <ion-title>{{'inform_non_attendance.title' | translate}}</ion-title>
  </ion-navbar>
</ion-header>

<ion-content padding>
  <form #form="ngForm">
    <ion-list no-lines>
      <ion-item-group>
        <ion-item-divider color="primary">
          {{'inform_non_attendance.title' | translate}}
        </ion-item-divider>

        <ion-item no-padding no-lines class="no-border">
          <ion-label stacked
            >{{'inform_non_attendance.reason' | translate}}</ion-label
          >
          <ionic-selectable
            placeholder="Selecione"
            item-content
            [isMultiple]="false"
            name="attendance_reason"
            [(ngModel)]="attendance_reason"
            [items]="attendance_reasons"
            itemValueField="id"
            required
            itemTextField="name"
            [canSearch]="true"
            searchPlaceholder="{{'search' | translate}}"
            searchFailText="{{'no_items_found' | translate}}"
          >
          </ionic-selectable>
        </ion-item>

        <ion-item no-padding no-lines class="no-border number-input">
          <ion-label stacked>{{'notes' | translate }}</ion-label>
          <ion-textarea
            placeholder="{{'notes' | translate }}"
            required
            [(ngModel)]="comments"
            name="comments"
          ></ion-textarea>
        </ion-item>

        <ion-grid class="pictures-grid">
          <ion-row>
            <ion-col col-4 *ngIf="picture">
              <img [src]="picture" (click)="openPicture(picture)" />
              <button
                ion-fab
                small
                color="danger"
                class="delete"
                (click)="picture = null"
              >
                <ion-icon name="md-close"></ion-icon>
              </button>
            </ion-col>
          </ion-row>
        </ion-grid>
        <ion-item no-lines no-padding no-margin class="inner-card-button">
          <button
            type="button"
            item-right
            ion-button
            big
            color="primary"
            (click)="presentActionSheet()"
          >
            Adicionar foto
          </button>
          <input
            #galleryInput
            type="file"
            accept="image/*"
            style="position: fixed; left: -9999px; width: 1px; height: 1px; opacity: 0"
            (change)="onGallerySelected($event)"
          />
        </ion-item>

        <ion-grid padding>
          <ion-row>
            <ion-col no-padding col-12
              ><button
                ion-button
                full
                [disabled]="form.invalid || start_time >= end_time"
                color="primary"
                (click)="save(form)"
              >
                SALVAR NÃO ATENDIMENTO
              </button></ion-col
            >
          </ion-row>
        </ion-grid>
      </ion-item-group>
    </ion-list>
  </form>
</ion-content>
