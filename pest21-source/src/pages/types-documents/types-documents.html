  Ionic pages and navigation.

<ion-header class="blue-nav">
  <ion-toolbar class="blue-nav" color="primary">
    <ion-navbar color="primary">
      <ion-buttons left>
        <button ion-button menuToggle>
          <ion-icon name="menu"></ion-icon>
        </button>
      </ion-buttons>
      <ion-title>{{'types-documents.title_page' | translate}}</ion-title>
    </ion-navbar>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="container" padding>
    <h2>{{'types-documents.title_page' | translate}}</h2>
    
    <ion-grid>
      <ion-row>
        <ion-col col-6>
          <button (click)="openDocuments()" ion-button outline block color="primary">
            <div>
              <ion-icon name="document"></ion-icon>
              <label>{{'products.main' | translate}}</label>
            </div>
          </button>
        </ion-col>
        <ion-col col-6>
          <button (click)="openProcedures()" ion-button outline block color="primary">
            <div>
              <ion-icon name="document"></ion-icon>
              <label>{{'procedures.main' | translate}}</label>
            </div>
          </button>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>
</ion-content>
