  See http://ionicframework.com/docs/components/#navigation for more info on
  Ionic pages and navigation.

<ion-header class="blue-nav">
  <ion-navbar color="primary">
    <ion-buttons left>
      <button ion-button menuToggle>
        <ion-icon name="menu"></ion-icon>
      </button>
    </ion-buttons>
    <ion-title>{{'os_notes.title' | translate}}</ion-title>
  </ion-navbar>
</ion-header>


<ion-content padding>
  <form #form="ngForm">
    <ion-list no-lines>
      <ion-item-group>
        <ion-item-divider color="primary">
         {{'notes' | translate}}
        </ion-item-divider>
        <ion-item no-padding no-lines class="no-border" text-wrap>
          <p>{{'os_notes.lettering' | translate}}</p>
        </ion-item>
        <ion-item no-padding no-lines class="no-border number-input">
            <ion-label stacked>{{'notes' | translate}}</ion-label>
            <ion-textarea placeholder="{{'notes' | translate}}" [(ngModel)]="info" name="info"></ion-textarea>
          </ion-item>
  
          <ion-grid padding>
              <ion-row>
                <ion-col no-padding col-12><button ion-button [disabled]="!info" full color="primary" (click)="save(info)">{{'save' | translate}}</button></ion-col>
              </ion-row>
            </ion-grid>
      </ion-item-group>
    </ion-list>
  </form>
</ion-content>
