<ion-header class="blue-nav">
  <ion-navbar color="primary">
    <ion-title>Pendências da Agenda</ion-title>
  </ion-navbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item
      class="list-item-client"
      *ngFor="let pending of pendings"
      (click)="goToSchedule(pending)"
      text-wrap
    >
      <h2>
        <strong
          >Pendência para {{pending.client.fantasy_name}} - JDE
          {{pending.client.code}}</strong
        >
      </h2>
      <br />
      <p [innerHtml]="pending?.description | sanitizeHtml"></p>
      <br />
      <p>
        <ion-badge color="danger" small
          >Não Resolvido - {{pending.type == 'less' ? 'Faltam agendamentos' :
          'Agendamentos excedentes'}}</ion-badge
        >
      </p>
    </ion-item>
  </ion-list>
</ion-content>
