<!--
  Generated template for the ClientsPage page.

  See http://ionicframework.com/docs/components/#navigation for more info on
  Ionic pages and navigation.
-->
<ion-header class="blue-nav">
  <ion-toolbar class="blue-nav" color="primary">
    <ion-navbar color="primary">
      <ion-buttons left>
        <button ion-button menuToggle>
          <ion-icon name="menu"></ion-icon>
        </button>
      </ion-buttons>
      <ion-title>{{'clientes_page.title' | translate}}</ion-title>
    </ion-navbar>
    <ion-searchbar
      [(ngModel)]="search"
      placeholder="Buscar por nome ou JDE"
      [showCancelButton]="false"
      (ionInput)="onInput($event)"
    >
    </ion-searchbar
  ></ion-toolbar>
</ion-header>

<ion-content>
  <!--<p padding>{{'clientes_page.lettering' | translate}}</p> -->
  <ion-list>
    <ion-item-sliding *ngFor="let client of clientsCopy">
      <ion-item text-wrap class="list-item-client">
        <ion-avatar item-start>
          <img src="assets/imgs/pests.png" />
        </ion-avatar>
        <h2>{{client.client.fantasy_name}}</h2>
        <p>JDE: {{client.client.code}}</p>
        <p>{{client.client.street}}</p>
        <p>
          <button
            ion-button
            [color]="client.is_vanished ? 'warning' : 'secondary'"
          >
            {{client.is_vanished ? client.vanished_label : client.status == 1 ?
            'CONTRATUAL' : 'AVULSO' }}
          </button>
        </p>
        <button
          ion-button
          icon-only
          item-end
          class="action"
          color="primary"
          (click)="openDetails(client)"
        >
          <ion-icon name="ios-more"></ion-icon>
        </button>
        <button
          ion-button
          icon-only
          item-end
          class="action"
          color="primary"
          [disabled]="client.is_vanished"
          (click)="openScheduleCreator(client)"
        >
          <ion-icon name="md-calendar"></ion-icon>
        </button>
      </ion-item>
      <ion-item-options side="right">
        <button ion-button color="primary" (click)="openDetails(client)">
          <ion-icon name="ios-more"></ion-icon>
          {{'clientes_page.details' | translate}}
        </button>
        <button
          ion-button
          color="secondary"
          [disabled]="client.is_vanished"
          (click)="openScheduleCreator(client)"
        >
          <ion-icon name="md-calendar"></ion-icon>
          {{'clientes_page.schedule' | translate}}
        </button>
      </ion-item-options>
    </ion-item-sliding>
  </ion-list>
</ion-content>
