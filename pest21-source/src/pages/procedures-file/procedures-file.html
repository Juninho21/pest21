<ion-header class="blue-nav">
  <ion-navbar color="primary">
    <ion-title>{{'procedures-file.title_page' | translate}} {{ document }}</ion-title>
  </ion-navbar>
  <ion-searchbar
      [(ngModel)]="search"
      placeholder="Buscar documentos"
      [showCancelButton]="false"
      (ionInput)="handleChange($event)"
    >
    </ion-searchbar>
</ion-header>

<ion-content padding>

  <ion-list>
    <button ion-item *ngFor="let doc of documents_old" (click)="download(doc)">
      <ion-icon name="document"></ion-icon> {{ doc.name }} 
    </button>
  </ion-list>
 
</ion-content>
