<ion-header class="blue-nav">
  <ion-navbar color="primary">
    <ion-title>{{'notifications_page.title' | translate}}</ion-title>
  </ion-navbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item
      class="list-item-client"
      *ngFor="let notification of notifications"
    >
      <h2>{{notification.title}}</h2>

      <p [innerHtml]="notification?.description | sanitizeHtml"></p>

      <p>{{momentView(notification.created_at).fromNow()}}</p>
      <p *ngIf="!notification.readed">
        <ion-badge small>Não lida</ion-badge>
      </p>
      <button
        ion-button
        item-end
        [color]="'primary'"
        (click)="openNotification(notification)"
      >
        Visualizar
      </button>
    </ion-item>
  </ion-list>
</ion-content>
