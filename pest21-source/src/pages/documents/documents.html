<!--
  Generated template for the ClientsPage page.

  See http://ionicframework.com/docs/components/#navigation for more info on
  Ionic pages and navigation.
-->
<ion-header class="blue-nav">
  <ion-toolbar class="blue-nav" color="primary">
    <ion-navbar color="primary">
      <ion-buttons left>
        <button ion-button menuToggle>
          <ion-icon name="menu"></ion-icon>
        </button>
      </ion-buttons>
      <ion-title>{{'products.title_page' | translate}}</ion-title>
    </ion-navbar>
    <ion-searchbar
      [(ngModel)]="search"
      placeholder="Buscar documentos"
      [showCancelButton]="false"
      (ionInput)="handleChange($event)"
    >
    </ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!--<p padding>{{'clientes_page.lettering' | translate}}</p> -->
  
    <ion-list>
      <button ion-item *ngFor="let folder of folders_old" (click)="openDocumentsFile(folder.id)">
        <ion-icon name="folder"></ion-icon> {{ folder.name }}
      </button>
    </ion-list>

</ion-content>
