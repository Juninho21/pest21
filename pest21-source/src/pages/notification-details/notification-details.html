<!--
  Generated template for the NotificationDetailsPage page.

  See http://ionicframework.com/docs/components/#navigation for more info on
  Ionic pages and navigation.
-->
<ion-header class="blue-nav">
  <ion-navbar color="primary">
    <ion-title>{{notification?.title}}</ion-title>
  </ion-navbar>
</ion-header>

<ion-content padding class="blue-nav">
  <div class="flex-content">
    <ion-card lines>
      <ion-card-header text-wrap lines>
        <h1><strong>{{notification?.title}}</strong></h1>
      </ion-card-header>
      <ion-card-content>
        <p [innerHtml]="notification?.description | sanitizeHtml"></p>
        <br />
        <br />
        <p>{{momentView(notification.created_at).fromNow()}}</p>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
